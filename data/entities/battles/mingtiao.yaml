description: 商汤乘夏桀失德、诸侯叛离，以伊尹为相，誓师伐夏。战于鸣条(地望有异说)，夏军大败，桀奔南巢，夏亡。商汤建国号商。年代据断代工程。
significance: 商代夏而立，史载以武力易姓代国之始。
