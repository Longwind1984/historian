description: 楚国王室马氏兄弟争位('群驹争槽'),国中大乱。951年秋南唐趁楚内乱派边镐率军入湖南,兵不血刃进入潭州,马希崇等出降,楚国灭亡。
significance: 楚国灭亡,湖南尽失。但南唐统治不善,不久刘言、王逵、周行逢相继起兵,湖南实际上重归割据。南唐得而复失,徒耗国力。
