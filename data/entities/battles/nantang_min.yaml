description: 闽国王氏宗室内乱,943年王延政于建州自立为帝,国号'殷'。945年南唐中主李璟趁乱派查文徽、边镐南下攻建州。八月建州陷落,王延政出降,闽国核心区域灭亡。
significance: 南唐借此役大幅扩张版图。但福州被吴越趁机夺取,福建一分为三;南唐连年用兵亦耗损国力。
