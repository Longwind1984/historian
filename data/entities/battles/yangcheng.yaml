description: 契丹第三次大举攻晋,晋军被围于白团卫村,顺风纵火围攻。晋军在绝境中反突击,符彦卿等率军借风沙反扑,大破契丹铁鹞子重骑。耶律德光乘骆驼仓皇北逃。
significance: 契丹惨败一度北撤,延缓其灭晋进程。但后晋未能巩固战果,终在946年中渡桥之降中灭亡。
