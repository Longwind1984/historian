description: 946 年契丹太宗耶律德光亲征后晋,在滹沱河之战大败晋军主力。947 年正月入汴梁,俘虏出帝石重贵,后晋亡。耶律德光改国号辽,于汴梁登基。掠掠后北返。
significance: 五代重大事件。中原首次完全沦于游牧民族之手(短暂)。刺激刘知远建国后汉。
