description: 1278 南宋流亡朝廷退至崖山。1279 元将张弘范率水陆大军围攻。宋军千余艘战船连成水寨,被围断水二十余日。决战宋军全军覆没。
significance: 丞相陆秀夫负 8 岁帝昺投海,从死者十余万。南宋亡。中国首次完全被北方游牧民族政权征服。
