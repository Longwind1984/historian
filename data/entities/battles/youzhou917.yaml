description: 917年三月契丹乘新州之胜围攻幽州,周德威坚守约200日。李存勖抽调李嗣源、李存审、阎宝率七万步骑自易州北上驰援。晋军以步兵大阵稳扎稳打对抗契丹骑兵,大破之,解幽州之围。
significance: 保全晋之河北战略要地,被誉为'古代以步制骑的典范'。延缓契丹南下进程。
