description: 商朝，亦称殷商。约前1600年汤灭夏建国，屡迁其都；盘庚迁殷(约前1300)后始定，自此甲骨文可证商王世系。前1046年牧野之战败于周，帝辛自焚，商亡。年代据夏商周断代工程框架。
