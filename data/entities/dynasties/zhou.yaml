description: 周朝。前1046年武王灭商建国，都镐京(西周)；前771年犬戎破镐京，平王东迁洛邑(东周)。分西周、东周(春秋战国)两段，前256年赧王亡于秦。共和元年(前841)起中国有精确纪年，此前为断代工程重建纪年。
