name: 北伐战争
date:
  year: 1926
  month: 7
end_date:
  year: 1928
  month: 12
category: war
polities_involved:
- k_minguo
importance: 2
description: 1926 年 7 月 9 日，国民革命军于广州誓师北伐，蒋介石任总司令。北伐军先取湖南、湖北，于汀泗桥、贺胜桥击败吴佩孚主力，攻克武汉；继而在江西、福建击败孙传芳；1927
  年进军长江下游，定都南京。1928 年继续北进，5 月日军制造济南惨案阻滞北伐，6 月张作霖退往东北被炸死于皇姑屯。12 月张学良东北易帜，北伐在形式上完成全国统一。
impact: 形式上结束北洋军阀统治，国民政府成为中国中央政权；但新军阀割据与国共分裂随即显现。
sources:
- 中华民国史·第二编
- 曾庆榴·北伐战争史
