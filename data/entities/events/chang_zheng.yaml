id: e_chang_zheng
type: Event
name: 长征
date:
  year: 1934
  month: 10
end_date:
  year: 1936
  month: 10
category: war
importance: 2
description: 1934 年 10 月，中央苏区第五次反围剿失败，中央红军主力自江西突围，开始战略转移。途经湘江战役重大伤亡，1935 年 1 月遵义会议确立毛泽东在党和红军中的领导地位。此后四渡赤水、巧渡金沙江、强渡大渡河、飞夺泸定桥，翻雪山过草地。1935
  年 10 月中央红军到达陕北吴起镇，1936 年 10 月红一、二、四方面军在甘肃会宁、宁夏将台堡会师，长征结束。
impact: 中共中央及红军主力转移至陕北，保存力量并形成新的革命中心，为抗日民族统一战线的形成与全民族抗战准备条件。
sources:
- 中国共产党历史·第一卷
- 力平·中国工农红军长征史
