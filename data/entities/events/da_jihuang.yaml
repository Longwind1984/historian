id: e_da_jihuang
type: Event
name: 大饥荒
alias:
- 三年大饥荒
- 三年困难时期（官方用语）
- 三年自然灾害（官方用语）
date:
  year: 1959
end_date:
  year: 1961
category: disaster
importance: 1
description: 1959至1961年遍及全国的大饥荒。主因是"大跃进"与人民公社化的政策：大炼钢铁抽走农业劳力，"浮夸风"层层虚报产量致统购统销按虚数过度征粮，公共食堂与"反瞒产私分"进一步夺走农民口粮，粮荒发生后又长期封锁消息、限制逃荒。官方曾以"自然灾害"归因，但据气象与农业数据研究，同期全国性灾害程度不足以解释饥荒规模（金辉、杨继绳）。
impact: 学界估计非正常死亡约1500万至4500万人，多数研究集中于3000万上下（蒋正华约1700万；曹树基约3250万；杨继绳《墓碑》约3600万；冯客称"至少4500万"，为下限而非点估计）。中国官方从未公布死亡数字，长期以"三年困难时期""三年自然灾害"称之。1962年七千人大会后经济转入调整；该事件在中国大陆的公开研究与讨论长期受限。
sources:
- 杨继绳·墓碑：中国六十年代大饥荒纪实
- 冯客·毛泽东的大饥荒
- 曹树基·大饥荒：1959-1961年的中国人口
- 丁抒·人祸
