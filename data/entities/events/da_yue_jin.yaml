id: e_da_yue_jin
type: Event
name: 大跃进
date:
  year: 1958
end_date:
  year: 1960
category: reform
importance: 2
description: 1958至1960年，中共推行以"超英赶美"为目标的经济运动：全民大炼钢铁（土法小高炉产出多为不可用的废铁，并大量砍伐林木、毁坏农具充作原料）、大办人民公社与公共食堂、推行深耕密植等违背农学常识的做法。各级"浮夸风"层层虚报粮食产量，中央按虚报数字下达统购任务，农村口粮被过度征走。1959年庐山会议上彭德怀上书直陈问题，被打为"反党集团"，纠"左"中断、转为"反右倾"。
impact: 农业与生态遭重创，直接引发1959至1961年大饥荒（数千万人非正常死亡）。1962年七千人大会上毛泽东作检讨，经济转入调整。1981年《关于建国以来党的若干历史问题的决议》将其列为"左"倾错误。
sources:
- 杨继绳·墓碑：中国六十年代大饥荒纪实
- 麦克法夸尔·文化大革命的起源(第二卷)
- 中共中央·关于建国以来党的若干历史问题的决议(1981)
