description: 166-184 桓、灵二帝时,宦官专权。士大夫李膺、范滂等清流与宦官对抗。宦官以'党人'罪名禁锢百余人。184 黄巾起义后才赦免党人,但东汉已摇摇欲坠。
impact: 东汉政治关键事件,反映士大夫与宦官的长期冲突。
