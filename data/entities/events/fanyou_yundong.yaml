id: e_fanyou_yundong
type: Event
name: 反右运动
alias:
- 反右派斗争
date:
  year: 1957
category: purge
importance: 2
description: 1957年，中共以"整风"名义号召党外人士"大鸣大放"提意见，两个月后转而开展"反右派斗争"，将大批应邀提出批评的知识分子、民主人士与青年学生划为"右派分子"。被划者多遭开除公职、劳动教养、下放农村或监禁，家属子女在升学就业上长期受牵连；部分人死于劳教或自杀。
impact: 官方1978年后"改正"时的数字为55万余人，另有研究认为连同"中右""内控"等实际逾百万（丁抒）。1978至1981年中共中央为绝大多数被划右派者改正，仅96人未获改正（其中中央级5人：章伯钧、罗隆基、储安平、彭文应、陈仁炳）。知识界的独立批评空间就此萎缩，客观上削弱了对此后"大跃进"冒进的制约。
sources:
- 丁抒·阳谋：反右派运动始末
- 中共中央·关于全部摘掉右派分子帽子的通知(1978年4月5日,中发〔1978〕11号)
- 中华人民共和国史
