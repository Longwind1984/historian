id: e_guo_gong_he_zuo
type: Event
name: 第一次国共合作
date:
  year: 1924
  month: 1
end_date:
  year: 1927
  month: 7
category: diplomacy
importance: 2
description: 在共产国际推动下，1923 年孙中山与苏俄代表越飞发表《孙文越飞联合宣言》。1924 年 1 月中国国民党第一次全国代表大会在广州召开，确立联俄、联共、扶助农工三大政策，允许共产党员以个人身份加入国民党，第一次国共合作正式形成。合作期间创办黄埔军校、组织国民革命军、发动北伐。1927
  年四一二、七一五事件后合作破裂。
impact: 国共两党合力推动北伐战争迅速推进，亦为日后国共长期对立埋下根源。
sources:
- 中华民国史·第二编
- 中国共产党历史·第一卷
