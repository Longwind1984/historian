description: 617 年李渊太原起兵,攻克长安,立代王杨侑为帝(隋恭帝)。618 年炀帝被弑,李渊受禅称帝,国号唐,改元武德。
impact: 唐朝(618-907)开始,中国历史上影响最深远的朝代之一。
