id: e_jiannan_chengzhong_li_jianyong
type: Event
name: 沙陀助唐平黄巢
date:
  year: 881
category: war
importance: 2
location: pl_taiyuan
polities_involved:
- k_tang
description: 881 年唐廷召李克用率沙陀兵讨黄巢。883 年李克用收复长安,黄巢东撤。884 年李克用追击黄巢至河南,黄巢败于狼虎谷,为外甥林言所杀。
impact: 沙陀因此役正式登上中原政治舞台,李克用被封河东节度使,奠立后唐基业。
sources:
- 旧唐书·僖宗纪
- 旧五代史·武皇纪
end_date:
  year: 884
