description: 1125 金军分两路南侵。1126 围开封,李纲守御,金军退后又至。1127 正月开封城破。三月金军掳徽宗、钦宗二帝及皇室三千余人北去,掠尽财宝典籍百工。北宋亡。
impact: 中国历史重大转折,南北分立。'靖康耻'。
sources:
- 宋史·钦宗本纪
- 宋史纪事本末·卷56·金人南侵
