  note: 金军西路由粘罕自云中趋太原，连陷朔、代后围太原。《宋史纪事本末·卷56·金人南侵》
- from: pl_beijing_ylcj
  to: pl_kaifeng
  side: k_jin
  note: 金军东路由斡离不自平州入燕山，得郭药师为向导后长驱南下围汴京；平州尚无地点实体，故从史载途中明确占据的燕京起记。《宋史纪事本末·卷56·金人南侵》
