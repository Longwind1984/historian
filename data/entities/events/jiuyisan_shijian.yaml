id: e_jiuyisan_shijian
type: Event
name: 九一三事件(林彪出逃)
date:
  year: 1971
  month: 9
category: coup
polities_involved:
- k_prc
importance: 2
description: 1970 年庐山会议(九届二中全会)后，林彪与毛泽东的分歧公开化。据官方公布，林立果等拟《"571 工程"纪要》谋刺毛泽东，事泄。1971
  年 9 月 13 日凌晨林彪偕妻叶群、子林立果乘三叉戟机自山海关机场出走，坠毁于蒙古温都尔汗，机上人员俱亡。
impact: 接班人写入党章者叛逃身死，文革的合法性遭受重创，民间信仰动摇；此后周恩来主持整顿，邓小平于 1973 年复出。事件细节至今仍有争议。
sources:
- 当代中国史
- 中华人民共和国史
