alias:
- 1989年天安门事件
- 八九民运
- 1989年政治风波（官方用语）
date:
  year: 1989
category: other
importance: 2
description: 1989年4月15日胡耀邦逝世引发悼念活动，继而发展为北京及全国多地以学生为主、市民广泛参与的示威，诉求包括反官倒腐败、新闻自由与政治改革。5月13日起部分学生绝食，5月20日北京宣布戒严。6月3日夜至4日凌晨，戒严部队以武力清场，向平民开枪并以装甲车辆推进，造成大量死伤。
impact: 死亡人数官方称约300人（含军人）；1989年6月香港媒体引述中国红十字会人员的说法约2600人，该数字未经正式公布并随后遭官方否认；1989年英国驻华使馆电报（2017年解密）引述中方消息源称"至少一万人"，普遍认为高估；多数独立研究估计为数百至一千余人。官方至今未公布完整名单或独立调查结果。赵紫阳被免去总书记职务并遭软禁至2005年逝世。此后中国大陆对该事件的公开讨论、纪念与研究长期受严格限制。
sources:
- 吴仁华·六四事件全程实录
- 英国驻华大使馆1989年6月解密电报(2017年公开)
- 封从德·六四日记
