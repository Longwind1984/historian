description: 523-525 年北魏北方六镇(沃野、怀朔、武川、抚冥、柔玄、怀荒)军户起义。被尔朱荣镇压。但六镇武人集团从此走上政治舞台。
impact: 孕育了关陇集团(宇文泰)和高欢集团,直接导致北魏分裂。
