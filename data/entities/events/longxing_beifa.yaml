description: 孝宗起用张浚主持北伐。宋军三路出师。李显忠、邵宏渊失和,符离大溃,丧师十余万。次年隆兴和议(叔侄之国,岁币减)。
impact: 符离溃败使孝宗即位初年的恢复行动中止，次年隆兴和议改定宋金名分并减少岁币，但南宋未能收复中原。
sources:
