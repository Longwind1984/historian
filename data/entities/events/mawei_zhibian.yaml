id: e_mawei_zhibian
type: Event
name: 马嵬驿之变
date:
  year: 756
  month: 7
category: coup
importance: 3
location: pl_mawei
polities_involved:
- k_tang
description: 756 年六月安史乱军逼近长安,玄宗西奔入蜀。至马嵬驿,随驾禁军哗变,诛杨国忠,逼玄宗赐死杨贵妃。
impact: 玄宗政治生命终结。太子李亨北上灵武即位(肃宗),玄宗还都后为太上皇。
sources:
- 旧唐书·杨贵妃传
- 资治通鉴·卷218
