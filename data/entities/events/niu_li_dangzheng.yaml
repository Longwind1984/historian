id: e_niu_li_dangzheng
type: Event
name: 牛李党争
date:
  year: 821
category: purge
importance: 2
location: pl_chang_an
polities_involved:
- k_tang
description: 821-859 年(长庆元年至大中末)约 40 年的朝堂党争。牛党以牛僧孺、李宗闵为首,代表科举出身的新进士及山东寒族;李党以李德裕、李吉甫为首,代表门荫世族。双方围绕藩镇、宦官、佛教等问题互斗。
impact: 陈寅恪认为牛党代表'新兴进士阶级',李党代表'北朝以来山东士族'。争论激烈。耗损唐朝政治能量。
sources:
- 旧唐书·牛僧孺传、李德裕传
- 陈寅恪·唐代政治史述论稿
end_date:
  year: 859
