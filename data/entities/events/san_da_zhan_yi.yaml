id: e_san_da_zhan_yi
type: Event
name: 三大战役
date:
  year: 1948
  month: 9
end_date:
  year: 1949
  month: 1
category: war
polities_involved:
- k_minguo
importance: 2
description: 1948 年 9 月至 1949 年 1 月，中国人民解放军与国民党军进行战略决战。辽沈战役(1948.9-11)攻克锦州、沈阳，攻占东北全境；淮海战役(1948.11-1949.1)以徐州为中心歼灭国民党军主力，杜聿明被俘；平津战役(1948.11-1949.1)攻克天津、北平和平易帜(傅作义接受改编)。三大战役共歼灭及改编国民党军
  154 万余人。
impact: 国民党军主力基本被歼，长江以北尽失，国民政府统治基础瓦解，为其后渡江战役与中华人民共和国成立奠定局面。
sources:
- 中华民国史·第三编
- 中国人民解放军战史·解放战争卷
