id: e_shangyang_bianfa
type: Event
name: 商鞅变法
date:
  year: -356
category: reform
polities_involved:
- k_qin_state
importance: 1
description: 秦孝公即位(前361)下令求贤，卫鞅(商鞅)自魏入秦，以富国强兵之策说孝公，孝公任之为左庶长。前356年始行变法：废井田开阡陌、行县制、编户什伍连坐、奖耕战、明军功爵、抑商贾、禁私斗。前350年迁都咸阳，并魏邑。行之十年，秦民大悦，道不拾遗，山无盗贼，家给人足，诸侯畏惧。
impact: 变法奠定秦富国强兵之基，秦由是西霸戎翟、东凌三晋，国力跃居战国之首；商鞅虽于孝公死后遭车裂，然秦法未废，终成并天下之势。
sources:
- 史记·商君列传
- 史记·秦本纪
- 战国策·秦策
