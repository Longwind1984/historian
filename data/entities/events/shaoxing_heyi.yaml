description: 高宗、秦桧主和。约定:宋向金称臣;宋每年贡银 25 万两、绢 25 万匹;东以淮水、西以大散关为界。为促成和议,秦桧以'莫须有'罪杀岳飞(1142.1)。
impact: 宋金正式划定边界,南宋偏安格局确立。
