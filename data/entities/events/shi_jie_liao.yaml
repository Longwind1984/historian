description: 936 年石敬瑭反,求援于契丹。耶律德光率军入援,败唐军于晋阳。石敬瑭称帝,建国号晋,自称儿皇帝,割燕云十六州。后唐末帝自焚,后唐亡。
impact: 燕云十六州丢失,北方屏障尽失。中原数百年受制于游牧民族。
sources:
- 资治通鉴·卷280
- 旧五代史·晋高祖纪
ext:
  threads:
  - name: 燕云十六州
    role: 石敬瑭乞契丹之师,割地为酬——燕云之失由此
