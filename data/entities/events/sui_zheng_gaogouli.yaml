name: 隋征高句丽
date:
  year: 612
category: war
importance: 2
location: pl_liaodong_sui
polities_involved:
- k_sui
description: 612、613、614 年隋炀帝三次亲征高句丽。612 第一次出兵 113 万,因指挥失当败于萨水(平壤郊外)。613 杨玄感起兵而退。614 来护儿虽至平壤城下,无功而还。
impact: 国力耗尽,直接引发隋末农民大起义,导致隋朝灭亡。
sources:
- 隋书·炀帝纪
- 资治通鉴·卷181-182
end_date:
