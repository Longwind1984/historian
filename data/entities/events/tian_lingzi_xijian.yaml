description: 885 年宦官田令孜与王重荣争安邑、解县两池盐利,田令孜引邠宁朱玫、凤翔李昌符攻王重荣。王重荣与李克用入京,田令孜挟僖宗再幸凤翔、兴元。
impact: 晚唐宦官专权之极致,皇帝再次逃亡。
