id: e_wen_hua_da_ge_ming
type: Event
name: 文化大革命
alias:
- 文革
- 无产阶级文化大革命
date:
  year: 1966
end_date:
  year: 1976
category: purge
importance: 1
description: 1966年5月至1976年10月，由毛泽东发动并领导的全国性政治运动，以"反修防修""破四旧"为名。红卫兵运动兴起，大批党政干部、知识分子、教师及被划为"黑五类"者遭批斗、抄家、关押与迫害，各地爆发武斗；大量文物古迹、典籍与私人藏书被毁；高校停止正常招生多年，约1700万知识青年"上山下乡"。国家主席刘少奇1969年被迫害致死，彭德怀、贺龙、老舍等亦死于迫害。1971年林彪出走坠机身亡。1976年10月逮捕"四人帮"，运动结束。
impact: 非正常死亡缺乏官方统计。沃尔德与苏阳据1500余部县志统计，仅农村地区即约75万至150万人被害（麦克法夸尔、沈迈克《毛泽东最后的革命》引为保守估计）；各家对全国非正常死亡的估计自数十万至200万不等。1981年中共中央《关于建国以来党的若干历史问题的决议》称："文化大革命"是一场由领导者错误发动，被反革命集团利用，给党、国家和各族人民带来严重灾难的内乱。
sources:
- 中共中央·关于建国以来党的若干历史问题的决议(1981)
- 麦克法夸尔、沈迈克·毛泽东最后的革命
- 沃尔德、苏阳·文革在农村：范围、时序与人员损失(China Quarterly, 2003)
- 王年一·大动乱的年代
