type: Event
name: 五四运动
date:
  year: 1919
  month: 5
  day: 4
end_date:
  year: 1919
  month: 6
category: culture
importance: 2
description: 1919 年巴黎和会上，列强将德国在山东权益转交日本，消息传回国内。5 月 4 日北京 13 所高校学生 3000 余人于天安门前集会游行，提出"外争主权，内除国贼"，要求拒签和约、惩办曹汝霖等亲日官员，并火烧赵家楼曹宅。运动迅速蔓延至全国，6
  月上海工人罢工、商人罢市，形成"三罢"。北洋政府被迫罢免曹、章、陆三人，中国代表拒签对德和约。
impact: 中国工人阶级作为独立力量登上政治舞台，新文化运动推向高潮，促进马克思主义传播，为中国共产党成立准备条件。
sources:
- 彭明·五四运动史
- 中华民国史·第二编
