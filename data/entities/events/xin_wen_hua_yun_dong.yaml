id: e_xin_wen_hua_yun_dong
type: Event
name: 新文化运动
date:
  year: 1915
end_date:
  year: 1923
category: culture
importance: 2
description: 1915 年 9 月陈独秀在上海创办《青年杂志》(次年即 1916 年在上海改名《新青年》，1917 年编辑部迁北京)，标志着新文化运动兴起。以陈独秀、胡适、鲁迅、李大钊等为代表，高举民主与科学，反对旧道德、提倡新道德，反对旧文学、提倡白话文，输入西方思潮。1917
  年胡适《文学改良刍议》、陈独秀《文学革命论》推动白话文运动，1918 年鲁迅发表《狂人日记》。五四后渐转向传播马克思主义，至 1920 年代初告一段落。
impact: 推动白话文普及与思想解放，为中国近代思想转型奠基，并直接催生五四运动与马克思主义传播。
sources:
- 中华民国史·文化编
- 彭明·五四运动史
