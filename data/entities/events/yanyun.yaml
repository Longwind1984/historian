description: 936 年石敬瑭割让燕云十六州(幽、蓟、瀛、莫、涿、檀、顺、新、妫、儒、武、云、应、寰、朔、蔚)予契丹。中原北方屏障尽失,直到明初(1368)才由徐达、常遇春收复。
impact: 中国古代史最大地缘事件之一,影响 400 余年。
