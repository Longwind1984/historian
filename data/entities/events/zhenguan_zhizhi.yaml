description: 627-649 唐太宗在位期间。虚心纳谏(魏征)、轻徭薄赋、完善三省六部制与科举、平东突厥(630)、灭吐谷浑(634)、和亲吐蕃(文成公主,641)、玄奘西行(629-645)。
impact: 中国历史上著名的治世典范,唐朝进入全盛期。
