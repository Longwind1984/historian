id: e_zhong_gong_cheng_li
type: Event
name: 中国共产党成立
date:
  year: 1921
  month: 7
category: founding
importance: 2
description: 1921 年 7 月 23 日，中国共产党第一次全国代表大会在上海法租界望志路召开，因巡捕搜查，最后一天移至浙江嘉兴南湖游船继续。与会代表
  13 人，代表全国 50 余名党员，共产国际代表马林、尼克尔斯基列席。会议通过党纲与决议，选举陈独秀为中央局书记，宣告中国共产党成立。
impact: 中国出现以马克思主义为指导的无产阶级政党，深刻改变此后中国政治走向。
sources:
- 中国共产党历史·第一卷
- 中华民国史·第二编
