id: e_zhongying_lianhe_shengming
type: Event
name: 中英联合声明(一国两制)
date:
  year: 1984
  month: 12
category: treaty
polities_involved:
- k_prc
importance: 2
description: 1982 年撒切尔访华开启香港前途谈判。邓小平提出"一国两制":中国 1997 年收回香港主权，香港保持原有资本主义制度与生活方式五十年不变，高度自治。1984
  年 12 月 19 日《中英关于香港问题的联合声明》在北京签署，1985 年 5 月互换批准书生效，为在联合国备案的国际条约。
impact: 确立了 1997 年香港回归的法律框架，亦为 1987 年《中葡联合声明》(澳门)所沿用。
sources:
- 当代中国史
- 中英关于香港问题的联合声明
