description: 安史之乱后形成的魏博、成德、卢龙三藩镇割据势力。父死子继、自署官吏、贡赋不入。河朔藩镇模式为五代藩镇割据之滥觞。
significance: 晚唐'藩镇割据'的典型,深刻影响了五代十国的政治生态。后唐李嗣源即出于此系统。
peak_period: 代宗-后唐
