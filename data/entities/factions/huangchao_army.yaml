description: 唐末最大农民起义军。875 年王仙芝、黄巢起兵,880 年黄巢入长安称帝建齐。884 年黄巢败死。残部尚让等降朱温。
significance: 彻底摧毁唐朝根基。朱温(降唐的黄巢部将)成为最大军阀,沙陀李克用因平叛崛起——五代十国两大主导势力皆源于此。
peak_period: 僖宗朝
