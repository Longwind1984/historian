description: 中晚唐朝堂党争中的另一派。以李德裕、李吉甫为首,代表门荫世族、北朝以来的山东士族(陈寅恪说)。主张强力削藩、抑制宦官、毁佛。
significance: 李党执政时期(李德裕会昌年间)是晚唐短暂中兴。
peak_period: 长庆-大中
