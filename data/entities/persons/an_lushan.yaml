bio: 唐代胡人将领。营州柳城人(粟特+突厥血统)。受玄宗宠信,身兼三镇节度使。755 年发动安史之乱,756 年称帝,国号燕。757 年为子安庆绪所杀。
ext:
  significance: 安史之乱(755-763)是唐由盛转衰的转折,直接导致藩镇割据、河朔三镇、宦官专权——五代十国的所有病根皆源于此。
