bio: 泰定帝子。1328年泰定帝崩于上都,倒剌沙等拥立于上都,改元天顺;同时燕铁木儿在大都拥立图帖睦尔(文宗),史称两都之战。上都兵败,阿速吉八下落不明,在位仅月余。
