bio: 广西临桂(今属桂林)人，回族，桂系将领。保定军校毕业。与李宗仁统一广西，为新桂系核心。北伐时任国民革命军副总参谋长、东路军前敌总指挥。抗战时任军事委员会副参谋总长兼军训部长，参与指挥武汉、桂南诸役，人称"小诸葛"。1946 年任国防部长。1949 年赴台，1966 年病逝于台北。
