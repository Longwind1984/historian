bio: 白起，郿(今陕西眉县)人，嬴姓白氏，一名公孙起。秦昭王时名将，用兵神速，一生征战七十余，所歼甚众(后世累计约近百万，史记未给总数)，与王翦、廉颇、李牧并称战国四大名将。前293年伊阙之战大破韩魏联军二十四万。前278年拔楚都郢，楚迁都陈，因功封武安君。前260年长平之战大破赵军，坑降卒四十万，赵之壮丁尽丧。后秦复攻邯郸，白起力谏不可(赵已合纵，秦兵疲)，托病不行，触怒秦昭王，前257年贬为士卒，迁阴密，旋赐剑令自尽于杜邮。生年无载。
