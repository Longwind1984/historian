bio: 褒国(今陕西汉中西北)女子，姒姓。幽王伐褒，褒人献之；得宠生伯服。幽王废申后与太子宜臼，立褒姒为后、伯服为太子。传统史载"烽火戏诸侯"以褒姒为主角，现代据清华简《系年》质疑其事。其人见于记载，惟相关叙事多有后世建构。
sources:
- 史记·周本纪
