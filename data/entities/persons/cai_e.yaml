bio: 湖南邵阳人，近代军事家。1899 年留学日本，1904 年毕业于陆军士官学校。回国后任广西、云南新军教官。1911 年武昌起义后，在昆明领导重九起义，任云南都督。1913 年被袁世凯调京软禁。1915 年袁世凯称帝，蔡锷潜返云南，与唐继尧等通电讨袁，任护国第一军总司令，进兵川南，迫使袁取消帝制。1916 年 11 月病逝于日本福冈，国葬于长沙岳麓山。
