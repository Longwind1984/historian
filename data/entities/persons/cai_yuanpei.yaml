bio: 浙江绍兴人，近代教育家、思想家。清光绪进士，入翰林院。1904 年参与创立光复会，任会长，次年主要成员(含本人)以个人身份加入同盟会，光复会组织本身并未正式并入。1912 年任中华民国首任教育总长。1917 年起任北京大学校长，倡"兼容并包、思想自由"，延揽陈独秀、胡适、鲁迅等任教，使北大成为新文化运动中心。五四运动中营救被捕学生。1928 年任中央研究院院长。1940 年病逝于香港。
