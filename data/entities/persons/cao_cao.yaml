bio: 东汉末年杰出的政治家、军事家、文学家。沛国谯县人。189 起兵讨董卓,196 迎汉献帝都许,'挟天子以令诸侯'。200 官渡之战大破袁绍,统一北方。208
  赤壁之战败北,三国鼎立成。213 魏公,216 魏王。220 病卒,子丕代汉。
