bio: 天津人，北洋军阀直系首领。早年投奔袁世凯，毕业于天津武备学堂，北洋新军第三镇统制。民国后历任直隶督军、直鲁豫巡阅使。1920 年直皖战争击败段祺瑞，1922 年直奉战争击败张作霖，掌控中央。1923 年以贿选当选大总统，称"贿选总统"。1924 年冯玉祥北京政变后被囚，次年下野。1938 年病逝于天津。
