bio: 后周世宗。郭威养子(柴氏子)。954-959 在位,高平之战大败北汉,西败后蜀,南征南唐取江北十四州,北伐辽取瀛、莫。政治军事经济大改,奠北宋统一基础。959
  年北伐途中病卒。
