bio: 安徽怀宁(今安庆)人，近代思想家。早年留学日本。1915 年创办《青年杂志》(次年改《新青年》)，发起新文化运动，倡民主与科学。1917 年任北京大学文科学长。1920 年与李大钊酝酿建党，在上海发起马克思主义研究会，1921 年中国共产党成立，任中央局书记，连任五届最高负责人。1927 年大革命失败后被解除领导职务，1929 年被开除党籍。晚年居四川江津，1942 年病逝。
