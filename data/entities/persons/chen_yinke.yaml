bio: 江西义宁(今修水)人，近代史学家。早年游学日本、欧美多国，通晓多种语言。1925 年任清华国学研究院导师，与王国维、梁启超、赵元任并称"四大导师"。长期任清华、西南联大、岭南大学教授。治学兼通文史，精魏晋南北朝隋唐史、蒙元史，以诗文证史。著《隋唐制度渊源略论稿》《唐代政治史述论稿》《柳如是别传》等。晚年目盲足膑仍口述著述。1969 年病逝于广州。
