bio: 楚庄王，芈姓，熊氏，名旅(一作侣)，楚穆王之子。即位初三年不出号令，一鸣惊人，旋罢淫乐听政。任孙叔敖为令尹，整顿内政。前606年伐陆浑之戎，至洛水观兵周疆，问鼎之轻重。前597年邲之战大败晋军，称霸中原。在位约二十三年卒。
