bio: 孔子，子姓，孔氏，名丘，字仲尼，鲁国陬邑人。早年贫贱，为委吏、乘田；相传尝至周问礼于老子。中年仕鲁，由中都宰升司寇，摄相事。前497年去鲁周游列国十四年，历卫、曹、宋、郑、陈、蔡、楚，终不见用。晚年归鲁，删诗书、定礼乐、修《春秋》，聚徒讲学，相传弟子三千、贤者七十二。以"仁"为核心，述而不作，开儒家学派。前479年卒。
