bio: 原籍浙江吴兴，生于四川广汉，近代政治人物、理论家。早年留学日本，1909 年加入同盟会。民国后任孙中山秘书，长期参与机要。1925 年著《孙文主义之哲学的基础》《国民革命与中国国民党》，阐述"戴季陶主义"，为国民党右派理论代表。历任国民党中央宣传部长、考试院院长。1949 年 2 月于广州服安眠药自杀。
