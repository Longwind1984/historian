bio: 夏后氏，姒姓，名文命，鲧之子。奉舜命治水十三年，疏导九河、划分九州，因功受舜禅让，约前2070年建国号夏。涂山之会诸侯，又收九州之金铸九鼎。传说与半信史人物，年代模糊。
