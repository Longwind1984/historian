bio: 商末王，名受，谥纣。才力过人，曾征东夷拓疆；然传统史载其宠妲己、造酒池肉林、设炮烙之刑，杀比干、囚文王。牧野之战(前1046)兵败自焚于鹿台，商亡。现代学界指出其暴君形象部分为周人及后世累积建构，当审辨。亡年据断代工程。
