bio: 东汉末权臣。陇西临洮人,凉州军阀。189 入洛阳,废少帝,立献帝,自任太师,残暴。190 关东诸侯讨之,挟献帝迁都长安,焚洛阳。192 为司徒王允与吕布所杀。
ext:
