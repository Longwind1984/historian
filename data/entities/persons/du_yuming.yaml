bio: 陕西米脂人，抗日将领。黄埔军校第一期毕业。抗战时任第五军军长，1939 年指挥昆仑关战役，重创日军第五师团。后任中国远征军第一路副司令长官，入缅作战。1948 年任徐州"剿总"副总司令，在淮海战役中被俘。1959 年获特赦。1981 年病逝于北京。
