bio: 范蠡，字少伯，楚国宛人。佐越王勾践，前494年会稽之危后随勾践入臣于吴为质，归国后辅勾践卧薪尝胆、谋吴二十年。前473年灭吴，功成后泛舟五湖，变姓名适齐，号鸱夷子皮；又适陶治产积居成巨富，号陶朱公。后人传其兼擅谋国与货殖。
