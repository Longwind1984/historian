bio: 直隶河间(今属河北)人，北洋军阀直系首领。天津武备学堂毕业，曾赴日本考察军事，为袁世凯小站练兵骨干，与段祺瑞、王士珍并称"北洋三杰"。民国后任直隶都督、江苏都督。1916 年当选副总统，1917 年黎元洪去职后代理大总统，与段祺瑞在护法、对德宣战等问题上对立，形成"府院之争"。1918 年期满去职，1919 年病逝。
