bio: 五代名臣。历仕四朝十帝(桀燕/唐/晋/辽/汉/周),被称为'长乐老'。中国历史上最著名的'不倒翁'式政治家。主持刻九经。政事稳健,但后世欧阳修等以其事夷狄而讥之。
