bio: 吴王夫差，阖闾之子。前495年嗣位，誓报越仇，前494年夫椒大败越军，围勾践于会稽。许越求和后，北上争霸，凿邗沟、伐齐，前482年黄池之会与晋争长。越乘虚伐吴，几经反复，前473年越破吴都，夫差求为附庸不得，自刎，吴亡。
