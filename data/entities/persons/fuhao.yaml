bio: 商王武丁之后，子姓。甲骨卜辞记载其多次受命统兵征伐土方、羌方、巴方等，一次用兵达一万三千人，为已知中国最早见诸记载的女将。1976年殷墟妇好墓出土大量青铜礼器与玉器(含"妇好"铭文)，印证其存在与地位。生平属武丁时期(约前13世纪)，其存在有甲骨文与考古实物双重佐证，惟绝对年代模糊。
sources:
