bio: 唐末名将、文学家。南平郡王。879 年破南诏,坐镇江陵。黄巢北上时拥兵不击,致使黄巢渡江入长安。后迷信神仙,被部将毕师铎所杀。
ext:
  significance: 坐视黄巢北上致唐廷崩溃,是唐朝灭亡关键转折。
