bio: 共国(今河南辉县)君主，名和，姬姓。一说厉王出奔后诸侯奉共伯和摄天子事十四年(前841-前828)，称"共和行政"；另一说(《史记》)为周公、召公二相共和摄政，不立共伯和其人。两说并存，迄无定论。故其摄政在位之说不作帝王在位年填注。
