bio: 越王勾践，姒姓，相传少康之后，越侯之裔。前496年即位，败吴于檇李，吴王阖闾伤死。前494年夫差伐越，勾践困于会稽，屈膝求和，入臣于吴为奴。归国后尝胆自励(后世称"卧薪尝胆")，任范蠡、文种，十年生聚、十年教训。前473年大举伐吴，灭吴，夫差自尽。旋北上会诸侯于徐州，致贡周室，号称霸主。在位约三十二年卒。
