bio: 管仲，名夷吾，字仲，颍上人。初事公子纠，乾时之败后经鲍叔牙荐于齐桓公，任为相。主"尊王攘夷"，改革内政，通轻重、兴鱼盐之利，佐桓公九合诸侯、一匡天下，为春秋首霸第一功臣。孔子称"微管仲，吾其被发左衽矣"。前645年卒。
