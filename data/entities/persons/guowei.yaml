bio: 后周建立者。后汉枢密使。乾祐三年十一月因隐帝下诏杀之而起兵，同年十二月经澶州军变后受后汉太后诰命监国；广顺元年正月即帝位，国号周。改革弊政。954 年病死，养子柴荣继。
