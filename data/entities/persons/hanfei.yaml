bio: 韩非，韩之诸公子，与李斯俱师事荀子，斯自以为不如。口吃不善言而善著书，观往者得失之变，作《孤愤》《五蠹》《内外储》《说林》《说难》十余万言，集法家之大成，融法、术、势为一。秦王政见其书叹曰"寡人得见此人与之游，死不恨矣"。前234(或233)年韩非使秦，秦王悦之，李斯、姚贾谗曰"韩非韩之诸公子也，终为韩不为秦"，劝以法诛之或遣归；秦王下吏治非，李斯使人遗毒药使自杀，非欲自陈不得见，遂死狱中，秦王悔使人赦之已死。生卒约前280-前233。今存《韩非子》五十五篇，多出其手，少数后学所补或窜入。
