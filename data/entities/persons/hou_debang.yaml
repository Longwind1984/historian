bio: 福建闽侯人。化学工程学家。1920 年代主持永利碱厂，破解当时被西方垄断保密的索尔维制碱法，1933 年以英文著《纯碱制造》公之于世，打破技术封锁。1940 年代创"侯氏制碱法"(联合制碱法)，将合成氨与制碱两流程联合，氯化铵副产为肥，原料利用率大增。建国后任化工部副部长。
