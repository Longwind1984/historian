bio: 朔方人,羯族。原东魏将领,547 叛降梁。548 起兵围台城,549 破之,萧衍饿死。551 自立为帝,国号汉。552 为陈霸先、王僧辩所破,被部下所杀。
ext:
  significance: 南朝转折性事件,江南经济文化大破坏。
