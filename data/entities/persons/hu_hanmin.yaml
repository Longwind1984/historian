bio: 广东番禺人，近代政治人物。1902 年留学日本，1905 年加入同盟会，任书记部书记，多次在《民报》撰文论战。民初任广东都督、总统府秘书长。孙中山逝世后一度代理大本营大元帅。1920-30 年代为国民党元老派代表，与蒋介石在约法问题上对立。1931 年被蒋介石软禁于汤山，获释后居广州，主导西南政务。1936 年病逝于广州。
