bio: 湖南善化(今长沙)人，近代民主革命家。1902 年留学日本，1903 年 11 月 4 日发起筹备、1904 年 2 月 15 日在长沙与宋教仁等正式创立华兴会(任会长)。1905 年同盟会成立，任执行部庶务，成为仅次于孙中山的领袖，世称"孙黄"。先后指挥钦州防城、镇南关、黄花岗等起义。武昌起义后任民军总司令。1913 年二次革命任江苏讨袁军总司令，事败去日本、美国。1916 年病逝于上海。
