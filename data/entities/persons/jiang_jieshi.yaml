bio: 浙江奉化人，近代政治、军事人物。早年就学保定陆军速成学堂，1908 年留学日本入振武学校，期间加入同盟会。1924 年任黄埔军校校长。1926 年任国民革命军总司令，率师北伐。1928 年东北易帜后形式上完成统一。此后主政国民政府，与各地方实力派及中共多次冲突。1937 年全面抗战爆发后任国防最高委员会委员长，领导抗战。1949 年国民政府败退台湾，1950 年起任台湾当局领导人。1975 年病逝于台北。
