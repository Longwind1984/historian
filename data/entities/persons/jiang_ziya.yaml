bio: 姜姓，吕氏，名尚，字子牙。相传垂钓渭水遇文王，拜为师(师尚父)；佐武王牧野灭商，为周军主帅之一。封于齐(营丘)，为齐太公，齐国之始祖。后世兵家、道家、术数皆托名宗之，传《六韬》。生平含传说成分，年代模糊。
