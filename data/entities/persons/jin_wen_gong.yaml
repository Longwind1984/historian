bio: 晋文公，姬姓，名重耳，晋献公之子。献公宠骊姬，太子申生自杀，重耳出奔，流亡十九年历狄、卫、齐、曹、宋、郑、楚、秦诸国。前636年秦穆公送之归晋即位。任狐偃、赵衰，整饬内政，作三军。前632年城濮之战退避三舍大败楚军，旋践土会盟受周襄王策命为侯伯，继齐桓公称霸。前628年卒。
