bio: 北京人，满族正红旗，近代作家。原名舒庆春，字舍予。1918 年北京师范学校毕业，后任小学校长。1924 年赴英国伦敦大学东方学院任教，其间作《老张的哲学》《赵子曰》《二马》。1930 年回国，先后任教济南齐鲁大学、山东大学。1936 年起创作《骆驼祥子》。抗战时任中华全国文艺界抗敌协会总务部主任。1949 年后任北京市文联主席。1966 年去世。
