bio: 老子，姓李名耳，字聃，楚国苦县人(一说陈人)，尝为周守藏室之史。见周之衰，西出函谷关，应关令尹喜之请著上下篇，言道德之意五千余言，是为《道德经》。以"道"为天地本根，主无为、守柔、不争，开道家学派。其人生平与年代异说纷纭，传统列为春秋末人，与孔子同时；史载孔子尝问礼于老子。
sources:
