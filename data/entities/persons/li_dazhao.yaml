bio: 河北乐亭人，近代思想家。早年留学日本早稻田大学。1916 年回国，任北京大学图书馆主任、经济学教授。1918 年起在《新青年》发表《庶民的胜利》《我的马克思主义观》，为最早在中国系统介绍马克思主义者之一。1919 年支持五四运动。1920 年与陈独秀筹建中国共产党，并推动北方党组织，称"南陈北李"。1927 年 4 月 6 日被奉系张作霖逮捕，28 日以"里通苏联"罪在北京绞杀。
