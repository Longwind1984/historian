bio: 唐玄宗。710 唐隆政变诛韦后,712 即位。713 先天之变诛太平公主。开元(713-741)励精图治,史称'开元盛世',唐朝全盛。天宝(742-756)宠杨贵妃、任李林甫、杨国忠,怠政。755
  安史之乱爆发,763 平定。玄宗奔蜀,马嵬驿之变杨贵妃死,后还都为太上皇,762 崩。
