bio: 高祖次子。晋阳起兵首谋，破薛举、刘武周、王世充、窦建德，功盖诸王。626年玄武门之变杀太子建成、齐王元吉，旋即位。任魏征、房玄龄、杜如晦，纳谏轻赋、修《氏族志》、置安西都护府，破东突厥被尊'天可汗'，史称'贞观之治'。
