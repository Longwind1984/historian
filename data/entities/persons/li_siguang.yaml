bio: 湖北黄冈人，蒙古族。地质学家，创地质力学。早年留英，任北大地质系教授、中央研究院地质研究所所长。1950 年自英归国，任地质部部长。以地质力学理论指导找油，参与部署松辽平原勘探，1959 年大庆油田发现，一举推翻"中国贫油论"。亦倡地震地质研究。
