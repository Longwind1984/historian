bio: 湖北黄陂人，近代政治人物。北洋水师学堂毕业，曾参加甲午海战。后任湖北新军第二十一混成协统领。1911 年武昌起义后被起义军推举为湖北军政府都督。民国后于 1916 年袁世凯死后继任大总统，1917 年因与段祺瑞"府院之争"及张勋复辟去职。1922 年直奉战争后复任大总统，次年又被驱走。1928 年病逝于天津。
