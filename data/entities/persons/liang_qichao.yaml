bio: 广东新会人，近代思想家、学者。1890 年师从康有为，1898 年参与戊戌变法，事败流亡日本，创办《清议报》《新民丛报》，倡"新民说"，与革命派论战。民初组织进步党，先后任司法总长、财政总长。1918 年后退出政坛，专力学术与讲学，任清华国学研究院导师，著《清代学术概论》《中国近三百年学术史》等。1929 年病逝于北京。
