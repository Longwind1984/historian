bio: 广西桂林人，生于北京，近代哲学家、社会活动家。早年入顺天中学。1917 年任北京大学讲师，讲东西文化及其哲学，为现代新儒家早期代表。后致力于乡村建设运动，在山东邹平办乡村建设研究院。1941 年参与发起中国民主政团同盟。1946 年参加政治协商会议。1949 年后居北京。著《东西文化及其哲学》《中国文化要义》等。1988 年病逝于北京。
