bio: 廉颇，赵国人。赵惠文王时名将，以勇气闻于诸侯，与白起、王翦、李牧并称战国四大名将。前283年伐齐取阳晋，拜上卿。长平之战(前260)前期坚壁固守三年，秦不能克，秦乃施反间使赵以赵括代之，赵遂大败。前251年大破燕军于鄗，封信平君，假相国。与蔺相如争位列其下，相如避让，颇负荆请罪，结刎颈之交，世称"将相和"。赵悼襄王立(前245)使乐乘代颇，颇怒攻乐乘，奔魏；后复为楚将，无功，卒于寿春，临终叹"我思用赵人"。生卒无载，战国末人。
