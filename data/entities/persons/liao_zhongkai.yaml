bio: 广东惠阳人，生于美国旧金山，近代政治人物。1902 年留学日本，1905 年加入同盟会。长期掌国民党财政，历任广东革命政府财政部长。孙中山联俄联共政策的主要赞助者，1924 年国民党改组后任中央执行委员、工人部长、黄埔军校党代表，坚定支持三大政策。1925 年 8 月 20 日在广州国民党中央党部门前遇刺身亡。
