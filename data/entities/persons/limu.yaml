bio: 李牧，赵国北疆名将。长年守雁门、代郡以防匈奴，厚待士卒、坚壁不轻战，示弱骄敌；后一战破匈奴十余万骑，灭襜褴、破东胡，匈奴十余岁不敢犯赵边。后入朝御秦，于肥(前233)、番吾(前232)连却秦军，封武安君，秦人惮之。秦乃行反间，赂赵王迁宠臣郭开，诬牧谋反，前229年赵王使人代之，牧不受命，遂捕杀之(一说出微服被执见杀)。后三月王翦大破赵，虏赵王迁。
