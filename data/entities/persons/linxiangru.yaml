bio: 蔺相如，赵国人，本宦者令缪贤舍人。赵得楚和氏璧，秦昭王愿以十五城易之，相如奉璧入秦，察秦王无意偿城，完璧归赵(前283)，拜上大夫。前279年渑池之会随赵王赴秦，秦王请赵王鼓瑟，相如以颈血溅秦王，迫秦王击缶，全赵体面，拜上卿，位在老将廉颇之上。颇不服欲辱之，相如处处避让，称"先国家之急而后私仇"，颇闻之负荆请罪，结刎颈之交，世称"将相和"。其后事迹史无明载。生卒无载，战国末人。
