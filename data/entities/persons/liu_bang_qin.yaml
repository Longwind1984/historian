bio: 汉朝建立者。沛县丰邑人,平民出身。BC209 沛县起兵,称沛公。BC206 入关灭秦,约法三章。BC206 被项羽封为汉王。BC205 还定三秦,楚汉战争爆发。BC202
  垓下之战灭项羽,称帝建汉,都长安。BC202-195 在位。'汉承秦制',奠定汉朝。
