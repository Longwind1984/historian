bio: 蜀汉建立者。涿郡涿县人。汉中山靖王之后(自称)。早年颠沛。207 三顾茅庐,得诸葛亮。208 赤壁之战后据荆州。214 取益州。219 取汉中,自立汉中王。221
  称帝,国号汉(蜀),都成都。222 夷陵之战大败于陆逊。223 病卒于白帝城,托孤诸葛亮。
