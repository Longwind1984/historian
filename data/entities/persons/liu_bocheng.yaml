bio: 四川开县人。早年参加护国、护法战争，1916 年攻丰都时右眼中弹失明，时称"独眼将军"。1926 年入中共，参与南昌起义。留学苏联伏龙芝军事学院，长征中任红军总参谋长。抗战任八路军 129 师师长，与政委邓小平搭档，世称"刘邓"。解放战争率晋冀鲁豫野战军千里跃进大别山，后为第二野战军司令员。1955 年授元帅。1950 年代主持南京军事学院，1958 年"反教条主义"运动中被批。
