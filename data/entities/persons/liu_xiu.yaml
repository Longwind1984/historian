bio: 东汉建立者。刘邦九世孙。22 起兵反新莽。23 昆阳之战以 8000 破王莽 42 万(天文陨石助之)。25 称帝,建元建武,都洛阳。25-57 在位,平定群雄,统一全国。'光武中兴'。
