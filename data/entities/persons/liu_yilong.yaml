bio: 武帝三子。在位三十年,劝课农桑、轻徭薄赋,史称'元嘉之治'。三次北伐拓跋魏皆败,尤以元嘉二十七年(450)王玄谟北伐惨败、魏军饮马瓜步为甚(后世辛弃疾《永遇乐》'元嘉草草,封狼居胥,赢得仓皇北顾'即咏此事)。453年为太子刘劭所弑。
