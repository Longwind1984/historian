bio: 湖南衡山人。参加秋收起义，随毛泽东上井冈山，是三湾改编"支部建在连上"的最早实践者之一。长期任政治工作主官，抗战任八路军 115 师政委，主政山东根据地。解放战争任东北野战军政委，与林彪搭档，参与辽沈、平津战役。1955 年授元帅，十大元帅中唯一的政工元帅。建国后任总政治部主任。1963 年病逝。
sources:
