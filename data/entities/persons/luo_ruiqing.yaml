bio: 四川南充人。黄埔六期。建国后首任公安部长，主持镇反运动。1959 年任总参谋长。1965 年底被林彪、叶群构陷，指为"篡军反党"，遭批斗；1966 年 3 月跳楼自杀未遂致腿残，此案是文革发动前夜清洗高层的先声。1977 年平反后任军委秘书长，1978 年在西德治腿病期间病逝。1955 年授大将。
