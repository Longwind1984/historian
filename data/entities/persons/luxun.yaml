bio: 浙江绍兴人，近代文学家、思想家。原名周树人。1902 年留学日本，先学医，后弃医从文。1909 年回国，先后在杭州、绍兴任教，后任职教育部。1918 年在《新青年》发表中国第一篇白话小说《狂人日记》，为新文化运动主将。1920 年起任北京大学、北京女子高等师范学校讲师。1926 年后任教厦门大学、中山大学，旋定居上海专事写作。1930 年发起并领导中国左翼作家联盟。著《呐喊》《彷徨》《野草》等。1936 年病逝于上海。
