bio: 浙江桐乡人，近代作家。原名沈德鸿，字雁冰。1916 年入商务印书馆。1920 年参加《小说月报》革新，1921 年与郑振铎等发起文学研究会，同年加入中国共产党。1927-1928 年在上海作《蚀》三部曲，1928 年东渡日本。1933 年发表长篇小说《子夜》。抗战时任文艺界抗敌协会理事。1949 年后任文化部部长。1981 年病逝于北京。
