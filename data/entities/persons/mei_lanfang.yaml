bio: 江苏泰州人，生于北京，近代京剧表演艺术家。出身梨园世家，工旦角。博采众长，创"梅派"艺术，代表作有《贵妃醉酒》《霸王别姬》《天女散花》等。1919 年起多次赴日、美、苏演出，将京剧推向世界。抗战期间蓄须明志，罢演拒登台。1949 年后任中国京剧院院长。1961 年病逝于北京。
