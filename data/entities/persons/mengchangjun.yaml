bio: 孟尝君，名田文，齐威王之孙、靖郭君田婴之子，袭封于薛，号孟尝君，战国四公子之一。招致诸侯游士及逃罪者数千人，舍业厚遇之，名重天下。相齐、相秦。前299年入秦被囚，赖门客"鸡鸣狗盗"之技--盗狐白裘献秦王宠姬以求解，又学鸡鸣赚开函谷关城门--得脱归齐。前298年相齐，倡齐、韩、魏合纵攻秦，前296年破函谷关，秦割地请和。后遭齐王猜忌，奔魏相魏，约秦、三晋、燕合纵破齐(前284)。齐襄王立，畏文之势，与之和。文卒，诸子争立，齐、魏共灭薛。生卒无载，战国中期人。
