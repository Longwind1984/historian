bio: 孟子，姬姓，孟氏，名轲，字子舆(一说子车)，邹(今山东邹城)人。受业于孔子之孙子思的门人，继承发扬儒家，后世尊为"亚圣"，与孔子并称"孔孟"。早年游说齐、魏(梁)、宋、滕诸国，说齐宣王、梁惠王行仁政、王道，言"民为贵，社稷次之，君为轻"，皆不见用。晚年退与弟子万章、公孙丑等著书，作《孟子》七篇。主性善、仁政、义利之辨，距杨墨，辨王霸。生卒约前372-前289。
