bio: 墨子，名翟，相传为鲁国人(一说宋人)，手工业者出身。创墨家学派，主"兼爱""非攻""尚贤""节用""天志""明鬼"，反对礼乐奢靡与攻伐战争。其徒称墨者，有严密组织，以巨子为首，赴火蹈刃不旋踵。相传曾止楚攻宋。其说后由弟子后学辑为《墨子》。其学与儒家并称显学而立异。
