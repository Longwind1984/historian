bio: 商王，名旬。商自中丁后九世之乱、屡迁其都；盘庚即位后约前1300年迁都至殷(今安阳)，作《盘庚》三篇劝谕臣民迁居。迁殷后商都始定，国势由衰转稳，故商又称殷。年代据断代工程框架。
