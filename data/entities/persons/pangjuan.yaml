bio: 庞涓，魏国人。早年与孙膑俱学兵法，后为魏惠王将。忌孙膑之才，召至魏施以膑刑黥面，齐使载膑归齐。前354年庞涓率魏军围赵邯郸，齐田忌、孙膑救赵，于桂陵设伏破之。前341年魏伐韩，齐救韩，庞涓轻骑追击齐军，孙膑减灶示弱诱之入马陵狭谷，万弩齐发，魏军大溃，庞涓自杀(一说出战死)。
