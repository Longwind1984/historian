bio: 齐桓公，姜姓，名小白，齐襄公之弟。前685年自莒归国即位，用管仲为相，改革内政、作内政而寄军令，通渔盐之利，尊王攘夷。前651年葵丘会盟受周襄王赐胙，为春秋首霸。晚年管仲卒，信用易牙、竖刁，身死诸子争立，霸业骤衰。
