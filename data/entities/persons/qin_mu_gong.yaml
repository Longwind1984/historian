bio: 秦穆公，嬴姓，名任好。任用百里奚、蹇叔、由余，励精图治。干涉晋政，助晋文公入晋；后殽之战(前627)为晋所袭大败，东进受阻，乃西向伐戎，益国十二、开地千里，遂霸西戎，周天子致贺。在位约三十九年卒，殉百七十七人。
