bio: 屈原，名平，字原，又自云名正则、字灵均(见《离骚》)，楚国公族，与楚王同姓芈、屈氏。事楚怀王，为左徒、三闾大夫，博闻强记，明于治乱，娴于辞令；入则图议国事，出则应对诸侯，甚得怀王信任。主联齐抗秦、举贤授能，遭上官大夫等谗毁，去职放逐，辗转沅湘。前278年秦将白起破楚都郢，屈原悲愤绝望，怀石自沉于汨罗江(相传五月五日)。相传作《离骚》《九歌》《九章》《天问》等，开楚辞一派，后世并称"风骚"。生卒约前340-前278。
