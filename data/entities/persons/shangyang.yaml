bio: 商鞅，姬姓，公孙氏，名鞅，卫国公族，故称卫鞅、公孙鞅；后秦封之于商十五邑，号商君，世称商鞅。少好刑名之学，初事魏相公叔痤，痤病危荐于魏惠王，谓不用则杀之，王不能用。闻秦孝公下令求贤，遂西入秦，以强国之策说孝公。孝公六年(前356)任左庶长，始变法；后迁大良造。前340年率军败魏，俘公子卬，魏割河西之地，因功封商君。孝公卒(前338)，太子即位(惠文王)，旧贵族诬商鞅谋反，车裂于咸阳，灭其族，然秦法未废。生年史无明载，约前390。《商君书》旧题商鞅撰，实为商鞅及其后学辑录，非尽出其手。
