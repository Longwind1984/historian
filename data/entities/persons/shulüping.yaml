bio: 辽太祖耶律阿保机皇后。有断腕留冢事:阿保机死,诸将请殉,平斩己右腕纳于陵中代己身,而以此逼杀政敌百余人。926 阿保机死后废长子倍、立次子德光,927 德光即位,是为辽太宗。947 又欲立幼子李胡,为群臣所拒,遂被幽于祖州。
