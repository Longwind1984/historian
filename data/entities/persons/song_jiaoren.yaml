bio: 湖南桃源人，近代民主革命家。1904 年与黄兴创华兴会，同年底因长沙起义事泄流亡日本，研习政法。1905 年加入同盟会，任司法部检事。1912 年同盟会改组为国民党，任代理理事长，主张责任内阁与政党政治，领导国民党在第一届国会选举中获多数。1913 年 3 月 20 日于沪宁火车站遇刺，22 日身亡，引发二次革命。
