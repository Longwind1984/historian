bio: 宋襄公，子姓，名兹甫(一作兹父)，宋国国君，桓公之子。齐桓公卒后图霸，前639年盂之会为楚所执，旋释。前638年伐郑，楚救郑，战于泓水，襄公拘守"不鼓不成列"之古礼，待楚军渡河列阵方战，大败伤股，次年伤重而卒。其拘守旧军礼而败，反映商周"结日定战"旧战礼之尾声。
