bio: 苏秦，东周洛阳人。相传早年师鬼谷子，游秦不成，困顿归家，妻不下机、嫂不为炊，乃发愤苦读《太公阴符》。后周游列国，约山东六国合纵抗秦，相传佩六国相印。然其年代有重大争议：《史记》系苏秦于张仪同时，以为前333年约从、佩六国相印；1973年长沙马王堆帛书《战国纵横家书》出土后，唐兰、杨宽等据之考证苏秦实晚于张仪，主要活动于齐闵王时(约前300-前284)，为燕行反间于齐，前284年五国合纵伐齐，齐破，苏秦以反间事败见诛。两说并存，本条卒年从帛书后说(约前284)。
