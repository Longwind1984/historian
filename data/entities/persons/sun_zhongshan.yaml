bio: 广东香山(今中山)人，近代革命家、政治家，中华民国临时大总统。1894 年于檀香山创立兴中会，1905 年在东京合组同盟会，提出"驱除鞑虏，恢复中华，创立民国，平均地权"纲领与民族、民权、民生的三民主义。1912 年 1 月 1 日就任中华民国临时大总统。此后领导二次革命、护法运动。1924 年改组中国国民党，确立联俄、联共、扶助农工三大政策，创办黄埔军校。1925 年 3 月 12 日病逝于北京。
