bio: 孙膑，相传为孙武后裔，齐国人。早年与庞涓俱学兵法，涓为魏将，忌膑之才，召之至魏，处以膑刑(去膝盖骨)并黥面，故世称孙膑。齐使阴载之归齐，田忌荐于齐威王，以为军师。前353年桂陵之战献"围魏救赵"之计，大败魏军；前341年马陵之战用"减灶"诱敌，杀庞涓，虏魏太子申。后不知所终。生卒无载，战国中期人。《孙膑兵法》旧题孙膑撰，久佚，1972年山东临沂银雀山汉墓出土竹简残本，学界考为孙膑及其后学所辑，非尽出其手。
