bio: 孙武，齐国人，后入吴。以兵法十三篇见吴王阖闾，被任为将军，佐阖闾与伍子胥伐楚，前506年柏举之战大破楚军，攻入郢都。旧题其所著《孙子兵法》十三篇为兵学经典，论"知己知彼""不战而屈人之兵"。其生平先秦两汉记载简略，个别学者对其独立身份存疑。
