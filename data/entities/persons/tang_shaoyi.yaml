bio: 广东香山(今中山)人，近代政治人物。1874 年第三批留美幼童，入哥伦比亚大学肄业(中途退学，未毕业)。1881 年回国入天津税务衙门，长期在朝鲜协助袁世凯。民国后 1912 年 3 月任中华民国第一任内阁总理，因与袁世凯政见不合旋即辞职。1916 年被任命为外交总长但未就任，后任中山县长。1938 年在上海被刺身亡。
