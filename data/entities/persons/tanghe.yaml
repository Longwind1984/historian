bio: 濠州钟离人,与朱元璋同里。最早招元璋入郭子兴军者即汤和。灭方国珍、张士诚,封信国公。洪武功臣中独得善终 —— 晚年首请归田纳兵权,又暗弱不与政事,故免于胡蓝之狱。
sources:
- 明史·汤和传
