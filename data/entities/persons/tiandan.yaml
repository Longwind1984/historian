bio: 田单，齐国宗室远支。乐毅下齐七十余城，唯莒、即墨未下，田单率族人奔即墨，即墨大夫战死，被推为将。前279年燕昭王卒，惠王以骑劫代乐毅，田单先施反间去毅，复以"火牛阵"破敌——束兵刃于牛角、灌脂苇于牛尾，夜纵火燃之，壮士五千随之冲燕军——大破骑劫于即墨城下，追亡逐北，尽复齐七十余城，迎襄王于莒，封安平君。后相齐，入赵为相(号都平君)，卒。生卒无载，战国中期人。
