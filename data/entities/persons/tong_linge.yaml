bio: 河北高阳人，抗日将领。早年入冯玉祥西北军，曾任国民军第一军师长。1933 年参加长城抗战，同年任察哈尔民众抗日同盟军第一军军长。1937 年七七事变爆发，任第二十九军副军长，于北平南苑率部抗击日军。7 月 28 日在南苑战斗中阵亡，为全面抗战爆发后首批殉国的高级将领之一。
