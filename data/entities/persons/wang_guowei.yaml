bio: 浙江海宁人，近代学者。早年习西学，治哲学、美学，译康德、叔本华。后转入文史，1923 年应召任清废帝溥仪"南书房行走"。1925 年任清华国学研究院导师。治学广涉甲骨金文、宋元戏曲、西北史地，倡"二重证据法"。著《观堂集林》《宋元戏曲考》《人间词话》等。1927 年 6 月 2 日自沉于颐和园昆明湖。
