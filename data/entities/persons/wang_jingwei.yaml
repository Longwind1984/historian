bio: 原籍浙江绍兴，生于广东三水，近代政治人物。早年留学日本，1905 年加入同盟会，任《民报》主编。1910 年谋刺摄政王载沣入狱。民国后为国民党元老，历任中央执行委员、国民政府主席、行政院长。1938 年底自重庆出走，1940 年在南京另立国民政府(史称汪伪政权，亦称汪精卫政权)，任主席。1944 年病死于日本名古屋。
