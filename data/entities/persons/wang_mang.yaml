bio: 新朝建立者。魏郡元城人,汉元帝王皇后之侄。BC1 任大司马。AD6 摄政(居摄)。AD9 受孺子婴禅让,改国号'新'。推行托古改制(王田私属、五均六筦)。改官名、地名。失败,引发赤眉绿林起义。AD23
  为商人杜吴所杀,新亡。
