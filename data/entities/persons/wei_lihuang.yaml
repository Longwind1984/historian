bio: 安徽合肥人，抗日将领。早年投身行伍，追随孙中山。北伐、中原大战中为蒋嫡系将领。抗战时任第十四集团军总司令、第二战区副司令长官，参加忻口战役。1943 年任中国远征军司令长官，反攻缅北。1948 年任东北"剿总"总司令。1949 年赴香港，1955 年回到中国大陆。1960 年病逝于北京。
