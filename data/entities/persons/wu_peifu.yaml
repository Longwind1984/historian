bio: 山东蓬莱人，北洋军阀直系将领。秀才出身，入保定陆军速成学堂，曹锟部下。1918 年起在南北战争中崭露头角。1920 年直皖战争、1922 年第一次直奉战争均为主力指挥，势力盛时控制鄂、豫、陕数省，为当时中外瞩目之实力派。1924 年第二次直奉战争因冯玉祥倒戈而败。1926 年被北伐军击溃，退居四川、北平。抗战时期拒受日伪拉拢，1939 年卒于北平。
