bio: 中国历史上唯一的女皇帝。并州文水人。唐太宗才人,高宗皇后。655 立为后。660 起与高宗并称'二圣'。高宗崩后临朝称制。690 改国号为周,称帝,都洛阳。705
  神龙革命中被迫退位,传位中宗,唐复国。同年崩。
ext:
  significance: 中国唯一女皇帝。开创武举、殿试。任用酷吏。神龙革命后退位。
