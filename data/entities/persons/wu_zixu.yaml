bio: 伍子胥，名员，字子胥，楚国人，伍奢之子。楚平王信谗杀伍奢并其长子尚，子胥出奔，历宋郑入吴。佐吴王阖闾刺王僚夺位、破楚，前506年与孙武共率吴军攻入楚都郢，鞭平王尸三百。后谏吴王夫差拒越求和、慎防越患，夫差不听，反赐属镂之剑令其自尽，前484年子胥伏剑死。
