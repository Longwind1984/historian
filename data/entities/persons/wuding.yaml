bio: 商王，名昭，殷高宗。在位五十九年(断代工程约前1250-前1192)，任傅说于傅险为相，复兴商道，史称"武丁中兴"。其妻妇好多次统兵征伐土方、羌方、巴方，甲骨卜辞记载详备，为商代鼎盛期。年代据断代工程框架。
