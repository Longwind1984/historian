bio: 楚汉战争主要人物。下相人。项梁侄。BC209 起兵吴中。BC207 巨鹿之战破釜沉舟,大破秦军主力。BC206 入关,焚咸阳,自称西楚霸王,都彭城,分封十八路诸侯。BC205
  与刘邦战。BC202 垓下之战为韩信所败,突围至乌江自刎。
