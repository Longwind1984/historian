bio: 信陵君，名魏无忌，魏昭王少子、魏安釐王异母弟，封信陵君，战国四公子之一。礼贤下士，门客三千，曾为守门人侯嬴执辔迎客。前257年秦围赵邯郸，赵求救于魏，魏王畏秦，使将晋鄙率军十万屯邺观望。无忌用侯嬴计，使魏王宠姬如姬盗兵符，令勇士朱亥椎杀晋鄙，夺其军救赵，却秦存赵，是为"窃符救赵"。留赵十年，后归魏，前247年率五国之师大破秦军于河外，乘胜逐秦至函谷关。秦行反间，使人毁无忌于魏王，魏王使人代将，无忌乃谢病不朝，日夜饮酒近女色，前243年饮醇酒病卒；后十八年(前225)魏为秦所灭。
