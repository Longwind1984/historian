bio: 江苏宜兴人，近代画家、美术教育家。早年任教上海、北京大学。1919 年赴法留学，入巴黎国立美术学校。1927 年回国，历任中央大学艺术系教授、北平艺专校长。倡"素描为一切造型艺术之基础"，融合中西，工人物、走兽，代表作《田横五百士》《九方皋》《奔马》。1949 年后任中央美术学院院长。1953 年病逝于北京。
