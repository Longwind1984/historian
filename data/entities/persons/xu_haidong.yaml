bio: 湖北黄陂人。窑工出身。红二十五军军长，率部先期到达陕北，中央红军长征抵陕时借粮款五千大洋以济急，毛泽东称其"对中国革命有大功"。作战屡负重伤，1940 年后长期养病，未与闻建国后军事。1955 年授大将。文革中遭冲击，1970 年病逝于郑州。
sources:
