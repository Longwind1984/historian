bio: 山西五台人。黄埔一期。红四方面军总指挥，与张国焘共事，鄂豫皖、川陕根据地主要军事领导人。长征中随左路军南下受挫，西路军兵败河西走廊。抗战任八路军 129 师副师长。解放战争任华北军区第一副司令员，指挥临汾、晋中、太原战役。1955 年授元帅。文革中受冲击，1978 年后任国防部长。
sources:
