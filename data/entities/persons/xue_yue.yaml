bio: 广东乐昌人，抗日将领。保定军校毕业。早年参加东征、北伐。抗战时期任第九战区司令长官，1939-1942 年间指挥三次长沙会战，以"天炉战法"重创日军。后任徐州绥署主任、总统府参军长。1949 年赴台。1998 年病逝于台北。
