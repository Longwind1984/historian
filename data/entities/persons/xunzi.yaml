bio: 荀子，名况，字卿，赵国人，汉人避宣帝(刘询)讳又作孙卿。年十五(《史记》一作"年五十")始游学于齐，三为稷下学宫祭酒，最为老师。后适楚，春申君用为兰陵令；春申君死(前238)，荀子废，家于兰陵，著书数万言而卒。其学出入儒法，主性恶、隆礼重法、天行有常、明于天人之分，韩非、李斯皆其弟子。今存《荀子》三十二篇，多出其手，少数后学所补。生卒约前313-前238。
