bio: 隋炀帝。杨坚次子。600 年代兄杨勇为太子,604 年即位(疑弑父)。营东都洛阳,开大运河,三征高句丽,巡幸江都。穷奢极欲,劳民伤财。617 年李渊起兵,618
  年在江都被宇文化及所弑,隋亡。
ext:
  significance: 中国历史上最具争议的皇帝之一。大运河利在千秋,但其暴政直接导致隋朝覆灭。
  title: 隋炀帝
  regime: 隋
