bio: 应山人。1620 红丸、移宫两案中力争,声名大起。1624 上疏劾魏忠贤二十四大罪,反被诬受熊廷弼贿,下诏狱。狱中受土囊压身、铁钉贯耳之酷,1625 年七月死。
