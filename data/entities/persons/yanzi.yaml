bio: 晏婴，字仲，谥平，后人称晏平仲，夷维人，齐国名相。历事齐灵、庄、景三公，以节俭力行、直言敢谏著称，谏景公省刑薄敛、减礼奢泰。使楚折其辱，智辩闻名。传《晏子春秋》后人辑其言行。
