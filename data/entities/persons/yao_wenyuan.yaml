bio: 浙江诸暨人。以文字整人起家。1965 年 11 月《文汇报》发表《评新编历史剧〈海瑞罢官〉》，为文革发动的导火索：将吴晗剧作指为影射彭德怀罢官，由文艺批判转为政治清算。文革中主管舆论宣传，"四人帮"之一。1976 年 10 月被捕，1981 年特别法庭判有期徒刑二十年，1996 年刑满释放。2005 年病死。
sources:
