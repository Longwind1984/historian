bio: 秦朝建立者。BC247 即秦王位(13岁),BC238 亲政。BC230-221 十年灭韩、赵、魏、楚、燕、齐六国,完成统一。自称'始皇帝'。废分封,行郡县,统一文字、货币、度量衡、车轨。BC213
  焚书,BC212 坑儒。BC214 修长城。BC221-210 在位。BC210 七月东巡途中病卒于沙丘。宦官赵高与李斯篡改遗诏,立胡亥为二世,赐死扶苏。
