bio: 商初名相，伊氏，名挚。传为有莘氏媵臣，负鼎俎说汤，助汤灭夏。汤崩后历佐外丙、中壬、太甲；太甲暴虐，伊尹放之于桐宫三年，俟其悔过迎回复政(《尚书·太甲》)。《竹书纪年》另有伊尹篡位七年、太甲潜回诛之的异说，存参。
sources:
