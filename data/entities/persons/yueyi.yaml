bio: 乐毅，中山灵寿人，魏将乐羊之后。初仕赵，后至魏，闻燕昭王为郭隗改筑宫、折节下士，乃入燕，任亚卿。前284年率燕并护赵、楚、韩、魏之师，共五国伐齐，济西之战大败齐军，连下齐七十余城，唯莒、即墨未下。燕昭王封毅为昌国君。昭王卒(前279)，惠王立，中齐田单反间，以骑劫代毅，毅畏诛奔赵，赵封于观津，号望诸君。齐旋以火牛阵破骑劫，尽复七十余城。后燕赵皆欲用之，毅往来二国间，卒于赵。生卒无载，战国中期人。相传有《报燕惠王书》，收入《战国策》《史记》。
