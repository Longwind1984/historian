bio: 原籍安徽婺源(今属江西)，生于广东南海(今广州)，近代铁路工程师。1872 年作为首批留美幼童赴美，1881 年耶鲁大学毕业回国。曾参与唐津铁路、关内外铁路工程。1905 年任京张铁路总工程师兼会办，自主设计并主持修建中国人自建的第一条干线铁路京张铁路，创设"人"字形展线与竖井开凿法。1912 年任粤汉铁路会办。1919 年病逝于汉口。
