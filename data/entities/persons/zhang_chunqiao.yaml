bio: 山东巨野人。文革中任中央文革小组副组长，为其理论笔杆。1967 年一月夺权后主政上海，建"上海人民公社"，后改上海市革命委员会。著《论对资产阶级的全面专政》，为继续革命理论张目。官至中共中央政治局常委、国务院副总理、解放军总政治部主任。"四人帮"之一。1976 年 10 月被捕，1981 年特别法庭判死缓，后改无期。庭审始终不发一言。2005 年病死。
