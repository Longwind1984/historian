bio: 江苏通州海门(今南通)人，近代实业家、教育家。1894 年状元，授翰林院修撰。甲午后弃官从商，倡"实业救国""教育救国"。1899 年创办大生纱厂，其后在南通兴办垦牧、航运、盐业等企业，并建师范、小学、博物苑等，使南通成为近代模范县。曾任北洋政府农商总长。1926 年病逝。
