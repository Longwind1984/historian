bio: 浙江余杭人，近代国学大师、革命家。早年师从俞樾治经学。1903 年因《驳康有为论革命书》及邹容《革命军》序入狱三年。1906 年出狱东渡，任同盟会机关报《民报》主编，以经学鼓吹革命。民国后以讲学、著述为业，1913 年、1932 年两度应邀在北京大学讲学，晚年在苏州创办章氏国学讲习会。学术上承清代乾嘉学派，精音韵训诂，著《国故论衡》《新方言》等。1936 年病逝于苏州。
