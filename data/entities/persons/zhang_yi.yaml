bio: 张仪，魏国贵族后裔。相传与苏秦俱师鬼谷子(年代关系见苏秦条，学界有争议)。后入秦，秦惠文王以为相，行连横之策，说魏、楚等国事秦以破合纵。前328年相秦，以商於六百里诈楚绝齐，致楚背齐，秦旋败楚于丹阳、蓝田(前312)，楚由是大衰。惠文王卒(前311)，武王立，群臣毁之，张仪不为所容，请入魏，相魏一年而卒(前309)。
