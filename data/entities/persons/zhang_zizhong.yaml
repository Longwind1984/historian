bio: 山东临清人，抗日将领。早年入冯玉祥西北军。1933 年参加长城抗战。1937 年七七事变后一度代理冀察政务委员会委员长、北平市长，因与日周旋被舆论误解。后归队抗战，任第五十九军军长、第三十三集团军总司令。先后参加临沂、随枣、鄂北诸役。1940 年 5 月在枣宜会战中于湖北南瓜店阵地殉国，为二战中阵亡军衔最高的中国将领之一。
