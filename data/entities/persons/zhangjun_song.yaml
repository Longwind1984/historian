bio: 南宋主战派领袖。1130 富平之战集五路兵二十万败于金人,关陕尽失;1163 督师北伐,符离一溃而隆兴和议成。两度当国、两度丧师,而终身言战不悔 —— 主战派的抱负与其军事才具之间的落差,南宋无人比他更典型。
