bio: 赵武灵王，嬴姓，赵氏，名雍，赵肃侯之子。前325年即位。前307年力排叔父公子成等群臣异议，行胡服骑射，改宽袍车战为短衣骑兵，赵军骤强，北破林胡、楼烦，置云中、雁门、代郡，拓地千里。前299年传位于少子何(惠文王)，自称主父，欲专意军略、谋袭秦。后欲分赵予长子公子章，致章作乱。前295年章败奔沙丘宫，公子成、李兑围沙丘宫三月余，主父饿死其中。
