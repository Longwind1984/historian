bio: 周平王姬宜臼，周幽王之子，母申后。前771年犬戎破镐京、幽王被杀，申侯与诸侯立宜臼。次年(前770)平王东迁洛邑，史称东周。王室东迁后王畿日蹙、威信陵夷，天子徒拥共主虚名，诸侯力政、霸政迭兴。在位约五十一年崩，孙桓王立。
