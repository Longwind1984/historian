bio: 周族首领，姬姓，名昌，季历之子。继为商西伯，被纣囚于羑里，演《易》；阴修德政、翦商拓土，"三分天下有其二以服事殷"，为灭商奠基。在世未称王，武王灭商后追尊为文王。年代据断代工程重建，属模糊纪年。
