bio: 文王之子，姬姓，名发。继西伯位，以姜尚为师、周公旦为辅；孟津观兵后会八百诸侯。前1046年牧野之战灭商，建立周朝，都镐京，行分封。克商后约三年而崩。年代据断代工程。
