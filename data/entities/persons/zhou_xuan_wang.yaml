bio: 厉王之子，姬姓，名静(一作靖)。共和行政后即位，任召穆公、尹吉甫等，中兴周室，败玁狁、征淮夷徐戎，史称"宣王中兴"。晚年废籍田礼("不籍千亩")，千亩之战败于姜氏之戎，又丧南国之师，料民于太原，国势复衰。在位年据《史记·十二诸侯年表》，属精确纪年。
