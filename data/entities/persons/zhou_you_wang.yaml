bio: 宣王之子，姬姓，名宫湦(一作宫涅)。宠褒姒，废申后与太子宜臼，改立褒姒之子伯服。传统史载有"烽火戏诸侯"事，现代据清华简《系年》质疑其真；而幽王废嫡致申侯联犬戎攻周则较为信实。前771年犬戎破镐京，杀幽王于骊山下，西周亡。在位年据《史记·十二诸侯年表》。
sources:
