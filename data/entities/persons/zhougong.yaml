bio: 文王第四子，姬姓，名旦，武王之弟。辅武王灭商；武王崩、成王幼，周公摄政。东征平三监与武庚之乱，营建东都洛邑，制礼作乐、定宗法分封之制，奠周室八百年根基。七年还政成王。年代据断代工程重建，属模糊纪年。
