bio: 庄子，名周，字子休(相传)，宋国蒙(今河南商丘一带)人。曾为漆园吏，一生贫寒。楚威王闻其贤，厚币迎之许以为相，庄子辞不受，宁游戏污渎之中自快，不为有国者所羁。继承发展老子之道，为道家主要代表，与老子并称"老庄"。主齐物、逍遥、自然无为，非毁礼法，寓言宏肆，思辨精微。相传著书十余万言，今存《庄子》三十三篇(内篇七、外篇十五、杂篇十一)，内篇多认为出自其手，外、杂篇多为后学所作。生卒约前369-前286。
