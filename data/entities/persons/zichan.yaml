bio: 子产，姬姓，公孙氏，名侨，一字子美，郑穆公之孙。郑简公、定公时为执政卿。内政宽猛相济，作丘赋、铸刑书(前536)，将法律铸于鼎公之于众，为中国成文法之先。外御晋楚，周旋大国之间，保郑小国之安。孔子称其"惠人也"。
