id: k_yue_state
type: Polity
name: 越国
name_en: Yue (state)
color: '#d35400'
founded:
  year: -600
ended:
  year: -222
description: 越国。姒姓，相传少康之后，封于会稽。春秋晚期勾践卧薪尝胆，前473年灭吴，北上会诸侯于徐州，致贡周室，号称霸主。战国时为楚所逼，屡迁都；楚威王破越、杀无彊，越以此散(前306主流说)，越地残部至前222秦并楚时入秦。始封与灭年均为约数。
sources:
- 史记·越王句践世家
- 左传·哀公
- 史记·楚世家
ext:
  disputed: true
  note: 灭年异说：楚威王破越(前306主流说)与秦并越地(前222)二说，本表灭年从前222
