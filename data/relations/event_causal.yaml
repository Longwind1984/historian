  to: e_fengjian_zongfa
  type: led_to
  note: 克商而有天下,然殷遗与东土未附,乃封宗亲功臣以藩屏周,分封宗法之制由此立
  sources:
  - 史记·周本纪
  - 左传·僖公二十四年
- from: e_fengjian_zongfa
  to: e_zhougong_zhili
  type: led_to
  note: 分封既立,复以礼乐定尊卑亲疏,使封建有其秩序 —— 制度与仪节相为表里
  sources:
  - 尚书·周官
  - 礼记·明堂位
- from: e_fengjian_zongfa
  to: e_quanrong_po_haojing
  type: led_to
  note: 封建之制赖天子共主之威以维系;幽王失德、诸侯不至,犬戎遂破镐京,其制先坏而后国亡
  sources:
  - 史记·周本纪
- from: e_quanrong_po_haojing
  to: e_pingwang_dongqian
  type: led_to
  note: 镐京既破,平王避戎东迁洛邑,王畿日蹙、天子共主名存实亡,春秋之局自此始
  sources:
  - 史记·周本纪
# 战国
- from: e_shangyang_bianfa
  to: b_changping
  type: led_to
  note: 变法奠秦富国强兵之基,至长平乃能以举国之力久持三年而胜赵
  sources:
  - 史记·商君列传
  - 史记·白起王翦列传
- from: b_changping
  to: e_qin_mie_liuguo
  type: led_to
  note: 赵之壮丁尽丧,六国再无抗秦主力,统一之势自此不可逆
  sources:
  - 史记·白起王翦列传
  - 史记·秦始皇本纪
# 魏晋南北朝
- from: e_yongjia_zhiluan
  to: e_feishui_zhizhan
  type: led_to
  note: 永嘉后北方入十六国之局,前秦一统北方而挟以图南,遂有淝水之役
  sources:
  - 晋书·苻坚载记
- from: e_feishui_zhizhan
  to: e_xiaowendi_hanhua
  type: led_to
  note: 淝水一败前秦崩解,北方再分裂,拓跋鲜卑乘之而起;北魏既统北方,乃有孝文汉化之事
  sources:
  - 魏书·序纪
  - 魏书·高祖纪
- from: e_beizhou_mie_beiqi
  to: e_sui_mie_chen
  type: led_to
  note: 北周并北齐而北方一统,杨坚代周尽承其势,南陈遂无以抗
  sources:
  - 隋书·高祖纪
  - 陈书·后主纪
- from: e_sui_mie_chen
  to: e_sui_mo_qiyi
  type: led_to
  note: 统一既成,炀帝恃其富强而急役重敛(开河、征辽),民不堪命,大起义遂作
  sources:
  - 隋书·炀帝纪
# 明清之际
- from: e_hongjinjun_qiyi
  to: b_shanhai_guan
  type: led_to
  note: 明亡于流寇之继起,李自成入京;吴三桂引清军入关,一片石之战定清鼎中原之局
  sources:
  - 明史·流贼传
  - 清史稿·世祖本纪
# 现当代
- from: e_xi_an_shi_bian
  to: e_qi_qi_shi_bian
  type: led_to
  note: 西安事变促成第二次国共合作,内战暂止;半年后七七事变起,举国得以合力抗战
  sources:
  - 当代中国史
- from: e_san_da_zhan_yi
  to: e_prc_founding
  type: led_to
  note: 三大战役后国民党军主力尽失、长江以北皆易手,其统治基础瓦解,建政遂成定局
  sources:
  - 当代中国史
- from: e_prc_founding
  to: e_tudi_gaige
  type: led_to
  note: 新政权立,即以土地改革法废地主土地所有制,重定农村土地关系
  sources:
  - 当代中国史
- from: e_prc_founding
  to: e_kang_mei_yuan_chao
  type: led_to
  note: 建政甫一年即出兵朝鲜,冷战格局下的第一次直接对抗
  sources:
  - 当代中国史
