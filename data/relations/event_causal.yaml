# 事件因果链（Event ↔ Event）
# T4.5：为重大事件补"前因 -> 本事件 -> 后果"因果关联。
# 类型约定（见 schema/relations.yaml）：
#   led_to        from 导致 to（因 -> 果）
#   caused_by     from 起因于 to（from 的原因是 to），led_to 的逆语义
#   part_of       from 从属于 to（更大事件/时期）
#   concurrent_with  同期并发（无向）
# 每条必带 note（一句因果逻辑）+ sources（正史/公认史论）。
# 只连真实存在的事件实体（id 经 grep 核对）。

